name: Mvy Milestone 2.9 Rare & Anomalous Sequence Detection

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/mvy/source/common-voice-27/validated.tsv'
      - 'research/mvy/analysis/milestone-2.9/analyze_mvy_rare_anomalous.py'
      - '.github/workflows/mvy-milestone-2.9.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout FiKR-CD
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run M2.9 analysis
        run: python research/mvy/analysis/milestone-2.9/analyze_mvy_rare_anomalous.py
      - name: Publish machine-readable M2.9 manifest
        run: |
          mkdir -p public/research/mvy/milestone-2.9
          cp research/mvy/analysis/milestone-2.9/output/mvy-rare-anomalous-manifest.json public/research/mvy/milestone-2.9/mvy-rare-anomalous-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/research/mvy/milestone-2.9/mvy-rare-anomalous-manifest.json
          git diff --cached --quiet || git commit -m 'Publish Mvy Milestone 2.9 rare anomalous manifest'
          git push
      - name: Upload M2.9 research package
        uses: actions/upload-artifact@v4
        with:
          name: mvy-milestone-2.9
          path: research/mvy/analysis/milestone-2.9/output/
          if-no-files-found: error
          retention-days: 90
