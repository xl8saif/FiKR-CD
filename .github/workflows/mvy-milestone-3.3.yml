name: Mvy Milestone 3.3 Speaker Recording Metadata

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/mvy/source/common-voice-27/validated.tsv'
      - 'research/mvy/analysis/milestone-3.3/analyze_mvy_speaker_metadata.py'
      - '.github/workflows/mvy-milestone-3.3.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout FiKR-CD
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run M3.3 analysis
        run: python research/mvy/analysis/milestone-3.3/analyze_mvy_speaker_metadata.py
      - name: Publish public M3.3 manifest
        run: |
          mkdir -p public/research/mvy/milestone-3.3
          cp research/mvy/analysis/milestone-3.3/output/mvy-speaker-recording-metadata-manifest.json public/research/mvy/milestone-3.3/mvy-speaker-recording-metadata-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/research/mvy/milestone-3.3/mvy-speaker-recording-metadata-manifest.json
          git diff --cached --quiet || git commit -m 'Publish Mvy Milestone 3.3 speaker metadata manifest'
          git push
      - name: Upload M3.3 research package
        uses: actions/upload-artifact@v4
        with:
          name: mvy-milestone-3.3
          path: research/mvy/analysis/milestone-3.3/output/
          if-no-files-found: error
          retention-days: 90
