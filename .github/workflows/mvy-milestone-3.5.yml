name: Mvy Milestone 3.5 ASR Dataset Release
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/mvy/source/common-voice-27/validated.tsv'
      - 'research/mvy/analysis/milestone-3.4/**'
      - 'research/mvy/analysis/milestone-3.5/release_mvy_asr_dataset.py'
      - '.github/workflows/mvy-milestone-3.5.yml'
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/mvy/analysis/milestone-3.4/create_mvy_asr_splits.py
      - run: python research/mvy/analysis/milestone-3.5/release_mvy_asr_dataset.py
      - name: Publish public M3.5 manifest
        run: |
          mkdir -p public/research/mvy/milestone-3.5
          cp research/mvy/analysis/milestone-3.5/output/mvy-asr-dataset-release-manifest.json public/research/mvy/milestone-3.5/mvy-asr-dataset-release-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/research/mvy/milestone-3.5/mvy-asr-dataset-release-manifest.json
          git diff --cached --quiet || git commit -m 'Publish Mvy Milestone 3.5 ASR dataset release manifest'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: mvy-asr-dataset-milestone-3.5
          path: research/mvy/analysis/milestone-3.5/output/
          if-no-files-found: error
          retention-days: 90
