name: Mvy Milestone 5.1 DOI Dataset Release
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/mvy/analysis/milestone-5.1/create_doi_release.py
      - run: |
          mkdir -p public/research/mvy/milestone-5.1
          cp research/mvy/analysis/milestone-5.1/output/mvy-doi-release-metadata.json public/research/mvy/milestone-5.1/
          git config user.name 'github-actions[bot]'; git config user.email '41898282+users.noreply.github.com'
          git add public/research/mvy/milestone-5.1; git diff --cached --quiet || git commit -m 'Publish Mvy DOI release metadata'; git push