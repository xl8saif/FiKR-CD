name: Mvy Milestone 2.12 — Research Report and Dataset Release
on:
  workflow_dispatch:
  push:
    paths:
      - "research/mvy/source/common-voice-27/validated.tsv"
      - "research/mvy/analysis/milestone-*/*"
      - ".github/workflows/mvy-milestone-2.12.yml"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile M2 release
        run: python research/mvy/analysis/milestone-2.12/compile_mvy_milestone2_release.py
      - name: Commit public release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/research/mvy/milestone-2/
          if git diff --cached --quiet; then echo "No release metadata changes."; else git commit -m "chore: publish Mvy Milestone 2 research release"; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mvy-milestone-2-research-release
          path: research/mvy/analysis/milestone-2.12/
          retention-days: 90
