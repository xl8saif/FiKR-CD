name: Mvy Milestone 4.1 Linguistic Corpus Research
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/mvy/source/common-voice-27/validated.tsv'
      - 'research/mvy/analysis/milestone-4.1/analyze_mvy_linguistic_corpus.py'
      - '.github/workflows/mvy-milestone-4.1.yml'
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install regex
      - run: python research/mvy/analysis/milestone-4.1/analyze_mvy_linguistic_corpus.py
      - name: Publish public M4.1 manifest
        run: |
          mkdir -p public/research/mvy/milestone-4.1
          cp research/mvy/analysis/milestone-4.1/output/mvy-linguistic-corpus-manifest.json public/research/mvy/milestone-4.1/mvy-linguistic-corpus-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/research/mvy/milestone-4.1/mvy-linguistic-corpus-manifest.json
          git diff --cached --quiet || git commit -m 'Publish Mvy Milestone 4.1 linguistic corpus manifest'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: mvy-milestone-4.1
          path: research/mvy/analysis/milestone-4.1/output/
          if-no-files-found: error
          retention-days: 90
