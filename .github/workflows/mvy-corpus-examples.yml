name: Mvy Corpus Sentence-Level Lexical Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/mvy/source/1765213289901-Mvy_text_corpus.tar.gz'
      - 'research/mvy/analysis/milestone-corpus-examples/**'
      - '.github/workflows/mvy-corpus-examples.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout FiKR-CD
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF extraction dependency
        run: python -m pip install --disable-pip-version-check PyMuPDF

      - name: Build sentence-level lexical evidence
        run: python research/mvy/analysis/milestone-corpus-examples/build_corpus_examples.py

      - name: Validate full written dataset
        id: validate_written_dataset
        continue-on-error: true
        run: python research/mvy/analysis/milestone-written-dataset-validation/validate_written_dataset.py

      - name: Publish generated evidence and validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/mvyCorpusFullLexicon.json src/data/mvyCorpusExamples.json research/mvy/analysis/milestone-written-dataset-validation/output/
          git diff --cached --quiet || git commit -m 'data(mvy): publish written corpus validation'
          git push

      - name: Upload written-dataset research artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvy-written-dataset-validation
          path: |
            research/mvy/analysis/milestone-written-dataset-validation/output/
            src/data/mvyCorpusExamples.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail if written-dataset validation failed
        if: steps.validate_written_dataset.outcome == 'failure'
        run: exit 1
