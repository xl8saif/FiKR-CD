name: Mvy Milestone 5.3 Institutional Publication
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/mvy/analysis/milestone-5.3/build_institutional_package.py
      - run: |
          mkdir -p public/research/mvy/milestone-5.3
          cp research/mvy/analysis/milestone-5.3/output/fikrcd-institutional-publication-package.json public/research/mvy/milestone-5.3/
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/research/mvy/milestone-5.3; git diff --cached --quiet || git commit -m 'Publish FiKR&CD institutional Mvy package'; git push