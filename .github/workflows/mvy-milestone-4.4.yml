name: Mvy Milestone 4.4 Morphology and Syntax
on: {workflow_dispatch: {}, push: {paths: ['research/mvy/source/**','research/mvy/analysis/milestone-4.4/**','.github/workflows/mvy-milestone-4.4.yml']}}
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/mvy/analysis/milestone-4.4/analyze_morphology_syntax.py
      - run: |
          mkdir -p public/research/mvy/milestone-4.4
          cp research/mvy/analysis/milestone-4.4/output/mvy-morphology-syntax-manifest.json public/research/mvy/milestone-4.4/
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/research/mvy/milestone-4.4; git diff --cached --quiet || git commit -m 'Publish Mvy M4.4 morphology syntax manifest'; git push
      - uses: actions/upload-artifact@v4
        with: {name: mvy-milestone-4.4, path: research/mvy/analysis/milestone-4.4/output/, retention-days: 90}