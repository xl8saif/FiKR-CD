name: Mvy Milestone 2.11 — Lexical and Morphological Analysis
on:
  workflow_dispatch:
  push:
    paths:
      - "research/mvy/source/common-voice-27/validated.tsv"
      - "research/mvy/analysis/milestone-2.11/**"
      - ".github/workflows/mvy-milestone-2.11.yml"
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run M2.11 analysis
        run: python research/mvy/analysis/milestone-2.11/analyze_mvy_morphology.py
      - name: Publish public manifest
        run: |
          mkdir -p public/research/mvy/milestone-2.11
          cp research/mvy/analysis/milestone-2.11/mvy-lexical-morphology-manifest.json public/research/mvy/milestone-2.11/
      - name: Commit public manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/research/mvy/milestone-2.11/mvy-lexical-morphology-manifest.json
          if git diff --cached --quiet; then echo "No manifest changes."; else git commit -m "chore: publish M2.11 lexical morphology manifest"; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mvy-milestone-2.11-lexical-morphology
          path: research/mvy/analysis/milestone-2.11/
          retention-days: 90
