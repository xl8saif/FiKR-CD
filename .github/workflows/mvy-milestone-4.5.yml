name: Mvy Milestone 4.5 Lexicon and Dictionary
on: {workflow_dispatch: {}, push: {paths: ['research/mvy/source/**','research/mvy/analysis/milestone-4.5/**','.github/workflows/mvy-milestone-4.5.yml']}}
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/mvy/analysis/milestone-4.5/build_lexicon.py
      - run: |
          mkdir -p public/research/mvy/milestone-4.5
          cp research/mvy/analysis/milestone-4.5/output/mvy-lexicon-manifest.json public/research/mvy/milestone-4.5/
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/research/mvy/milestone-4.5; git diff --cached --quiet || git commit -m 'Publish Mvy M4.5 lexicon manifest'; for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 2; done
      - uses: actions/upload-artifact@v4
        with: {name: mvy-milestone-4.5, path: research/mvy/analysis/milestone-4.5/output/, retention-days: 90}